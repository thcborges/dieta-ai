name: CD Pipeline - Production (Prd GCP)

on:
  push:
    branches: [main]

env:
  GCP_REGION: us-central1
  PRD_PROJECT_ID: thcborges-dieta-ai-prd

jobs:
  quality-gate:
    name: Quality Gate & Testes de Integração
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.11.2

      - name: Instalar Dependências
        run: pnpm install --frozen-lockfile

      - name: Build Global
        run: pnpm build

      - name: Executar Testes Unitários & BDD com Cobertura >= 90%
        run: pnpm test:coverage

      - name: Testes de Integração de Infraestrutura
        run: pnpm --filter @dieta-ai/infra test

  trivy-security-gate:
    name: Trivy Security Scan & SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Trivy Vulnerability & Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  build-and-push-api:
    name: Build & Push API Image (us-central1)
    runs-on: ubuntu-latest
    needs: [quality-gate, trivy-security-gate]
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_PRD }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Autenticação Google Cloud (Prd)
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PRD }}

      - name: Configurar Docker para Artifact Registry (us-central1)
        if: env.GCP_SA_KEY != ''
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push da Imagem da API
        if: env.GCP_SA_KEY != ''
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/${PRD_PROJECT_ID}/dieta-ai/api:stable"
          IMAGE_SHA="us-central1-docker.pkg.dev/${PRD_PROJECT_ID}/dieta-ai/api:${{ github.sha }}"
          docker build -f apps/api/Dockerfile -t "${IMAGE_TAG}" -t "${IMAGE_SHA}" .
          docker push "${IMAGE_TAG}"
          docker push "${IMAGE_SHA}"

  terraform-prd:
    name: Terraform Apply Production (us-central1)
    runs-on: ubuntu-latest
    needs: [build-and-push-api]
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_PRD }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Validar Sintaxe Prd (terraform validate)
        run: |
          terraform -chdir=infra/terraform/environments/prd init -backend=false
          terraform -chdir=infra/terraform/environments/prd validate

      - name: Autenticação Google Cloud (Prd)
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PRD }}

      - name: Terraform Apply Prd (GCP us-central1)
        if: env.GCP_SA_KEY != ''
        run: |
          terraform -chdir=infra/terraform/environments/prd init
          terraform -chdir=infra/terraform/environments/prd apply -auto-approve -no-color
